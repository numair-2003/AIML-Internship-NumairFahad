<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 204 48" fill="none">
  <defs>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="60%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon: rounded square with gradient -->
  <rect width="48" height="48" rx="13" fill="url(#icon-grad)"/>
  <!-- Soft inner glow ring -->
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="12.5" fill="none"
        stroke="rgba(255,255,255,0.18)" stroke-width="1.5"/>
  <!-- Play button background circle -->
  <circle cx="24" cy="24" r="13" fill="rgba(255,255,255,0.12)"/>
  <!-- Play triangle - perfectly centered -->
  <path d="M20 16.5L33 24L20 31.5Z" fill="white" filter="url(#glow)"/>

  <!-- Wordmark: "Learn" in gradient -->
  <text
    x="60" y="32"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="23" font-weight="800" letter-spacing="-0.8"
    fill="url(#text-grad)">Learn</text>

  <!-- Wordmark: "Tube" in white -->
  <text
    x="134" y="32"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="23" font-weight="800" letter-spacing="-0.8"
    fill="white">Tube</text>

  <!-- Accent dot after "Tube" -->
  <circle cx="198" cy="13" r="3.5" fill="#67e8f9" opacity="0.9"/>
  <circle cx="202" cy="20" r="2" fill="#a78bfa" opacity="0.7"/>
</svg>

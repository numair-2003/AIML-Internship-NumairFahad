kind = "mobile"
previewPath = "/learntube-mobile/"
title = "LearnTube Mobile"
description = "A mobile companion app for LearnTube that lets learners add YouTube videos by URL and interact with AI-powered tools: chat Q&A with citations, AI-generated summaries, quizzes, and flashcards. Authenticated via Clerk and talks to the existing FastAPI backend."
version = "1.0.0"
id = "artifacts/learntube-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/learntube-mobile/" ]
localPort = 23719

[services.development]
run = "pnpm --filter @workspace/learntube-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/learntube-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/learntube-mobile", "run", "serve" ]

[services.env]
PORT = "23719"
BASE_PATH = "/learntube-mobile/"

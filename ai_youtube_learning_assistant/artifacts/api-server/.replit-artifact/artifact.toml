kind = "api"
previewPath = "/api"
title = "API Server"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "cd /home/runner/workspace/ai_youtube_learning_assistant/backend && python main.py"

[services.production]

[services.production.build]
args = ["sh", "/home/runner/workspace/ai_youtube_learning_assistant/backend/scripts/build_prod.sh"]

[services.production.run]
args = ["/home/runner/workspace/.pythonlibs/bin/python", "/home/runner/workspace/ai_youtube_learning_assistant/backend/main.py"]

[services.production.health.startup]
path = "/api/healthz"

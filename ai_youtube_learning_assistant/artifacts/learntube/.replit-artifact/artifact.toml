kind = "web"
previewPath = "/"
title = "LearnTube"
description = "AI YouTube Learning Assistant — paste any YouTube URL and chat with the video content. Powered by RAG: retrieves relevant transcript chunks and generates cited answers, summaries, quizzes, and flashcards."
version = "1.0.0"
id = "artifacts/learntube"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22797

[services.development]
run = "pnpm --filter @workspace/learntube run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/learntube", "run", "build" ]
serve = "static"
publicDir = "ai_youtube_learning_assistant/artifacts/learntube/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22797"
BASE_PATH = "/"
